<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="uiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171A16"/>
      <stop offset="100%" stop-color="#141713"/>
    </linearGradient>
  </defs>
  <!-- Window Frame -->
  <rect width="900" height="480" rx="12" fill="url(#uiBg)" stroke="#2D332B" stroke-width="2" filter="drop-shadow(0 16px 40px rgba(0,0,0,0.8))"/>
  
  <!-- Window Header -->
  <rect width="900" height="40" rx="12" fill="#141713" stroke="#2D332B" stroke-width="1"/>
  <circle cx="24" cy="20" r="6" fill="#FF725E"/>
  <circle cx="44" cy="20" r="6" fill="#C49A55"/>
  <circle cx="64" cy="20" r="6" fill="#C7D94C"/>
  <text x="450" y="25" text-anchor="middle" font-family="monospace" font-size="12" fill="#89977A">reliabench-dashboard-preview — 127.0.0.1:5173/app</text>

  <!-- Metric Panels -->
  <g transform="translate(30, 60)">
    <!-- Panel 1: Pass Rate -->
    <rect width="190" height="100" rx="8" fill="#1D211C" stroke="#3B5436" stroke-width="2"/>
    <text x="16" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#A7A393">OVERALL PASS RATE</text>
    <text x="16" y="68" font-family="monospace" font-size="34" font-weight="900" fill="#C7D94C">82.4%</text>
    <text x="16" y="88" font-family="monospace" font-size="10" fill="#89977A">Wilson 95% CI: [0.72 - 0.90]</text>

    <!-- Panel 2: Pass@k vs Pass^k -->
    <rect x="210" width="190" height="100" rx="8" fill="#1D211C" stroke="#2D332B" stroke-width="2"/>
    <text x="226" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#A7A393">PASS@k vs PASS^k</text>
    <text x="226" y="68" font-family="monospace" font-size="32" font-weight="900" fill="#E8DDC8">1.00 / 0.67</text>
    <text x="226" y="88" font-family="monospace" font-size="10" fill="#89977A">pass^k ≤ pass@k confirmed</text>

    <!-- Panel 3: Recovery Rate -->
    <rect x="420" width="190" height="100" rx="8" fill="#1D211C" stroke="#5E3F2A" stroke-width="2"/>
    <text x="436" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#A7A393">FAULT RECOVERY</text>
    <text x="436" y="68" font-family="monospace" font-size="34" font-weight="900" fill="#F06B45">85.7%</text>
    <text x="436" y="88" font-family="monospace" font-size="10" fill="#89977A">7 Injected Faults Recovered</text>

    <!-- Panel 4: Gateway Cost -->
    <rect x="630" width="210" height="100" rx="8" fill="#1D211C" stroke="#2D332B" stroke-width="2"/>
    <text x="646" y="28" font-family="monospace" font-size="10" font-weight="700" fill="#A7A393">BIFROST GATEWAY COST</text>
    <text x="646" y="68" font-family="monospace" font-size="32" font-weight="900" fill="#C49A55">$0.00342</text>
    <text x="646" y="88" font-family="monospace" font-size="10" fill="#89977A">1,480 Tokens Attributed</text>
  </g>

  <!-- Trajectory Scrubber / Timeline Mockup -->
  <g transform="translate(30, 180)">
    <rect width="840" height="260" rx="8" fill="#141713" stroke="#2D332B"/>
    <text x="20" y="30" font-family="monospace" font-size="12" font-weight="700" fill="#E8DDC8">ATIF v1.8 TRACE SCRUBBER · TRIAL #3 (SEED: 42)</text>
    
    <!-- Timeline Steps -->
    <g transform="translate(20, 50)">
      <!-- Step 0 -->
      <rect width="250" height="70" rx="6" fill="#1D211C" stroke="#3B5436"/>
      <text x="12" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#C7D94C">STEP 1: read_ci_logs</text>
      <text x="12" y="44" font-family="sans-serif" font-size="11" fill="#A7A393">Fetch recent CI build logs...</text>
      <text x="12" y="60" font-family="monospace" font-size="9" fill="#89977A">Status: 200 OK (80ms)</text>

      <!-- Step 1 (Fault Highlighted) -->
      <rect x="270" width="270" height="70" rx="6" fill="#2B1D1D" stroke="#FF725E" stroke-width="2"/>
      <text x="282" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#FF725E">STEP 2: [FAULT INJECTED] TOOL_ERROR</text>
      <text x="282" y="44" font-family="sans-serif" font-size="11" fill="#E8DDC8">update_quarantine_config error</text>
      <text x="282" y="60" font-family="monospace" font-size="9" fill="#FF725E">Taxonomy: TOOL_CONTRACT</text>

      <!-- Step 2 (Recovery) -->
      <rect x="560" width="260" height="70" rx="6" fill="#1D211C" stroke="#C7D94C"/>
      <text x="572" y="24" font-family="monospace" font-size="10" font-weight="700" fill="#C7D94C">STEP 3: [RECOVERED] RETRY #1</text>
      <text x="572" y="44" font-family="sans-serif" font-size="11" fill="#A7A393">Quarantine applied with backoff</text>
      <text x="572" y="60" font-family="monospace" font-size="9" fill="#C7D94C">Result: Task Verifier Passed</text>
    </g>

    <!-- Lower Execution Terminal -->
    <rect x="20" y="140" width="800" height="100" rx="6" fill="#0D0F0C" stroke="#232720"/>
    <text x="35" y="165" font-family="monospace" font-size="11" fill="#F06B45">$ reliabench run --pack flaky_test_triage --agent resilient --fault TOOL_ERROR --seed 42</text>
    <text x="35" y="185" font-family="monospace" font-size="11" fill="#C7D94C">[HARNESS] Injected TOOL_ERROR at step 2 on tool 'update_quarantine_config'</text>
    <text x="35" y="205" font-family="monospace" font-size="11" fill="#A7A393">[AGENT] Self-healing retry active · Exponential backoff 150ms · Step recovered</text>
    <text x="35" y="225" font-family="monospace" font-size="11" fill="#E8DDC8">[SCORECARD] Pass Rate: 100% | Pass^k: 1.00 | Recovery Rate: 100% | Category: CLEAN</text>
  </g>
</svg>
